<script>
(function(){
  // カウントダウン
  var target=new Date('2026-12-12T18:30:00+09:00').getTime(),cd=document.querySelectorAll('#cd b');
  function tick(){var s=Math.max(0,Math.floor((target-Date.now())/1000));
    var v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];v.forEach(function(n,i){cd[i].textContent=n})}
  tick();setInterval(tick,1000);
  // スクロール出現
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
  [].forEach.call(document.querySelectorAll('.reveal'),function(x){io.observe(x)});
  // タブ
  var F=[['18:30 乾杯','幹事の挨拶のあと、全員で乾杯します。'],['19:00 歓談','席を自由に移動して、ふだん話さない人とも歓談。'],['20:00 ゲーム大会','チーム対抗のゲーム大会。景品あり。'],['20:45 締め','集合写真を撮って、解散です。']];
  var tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
  F.forEach(function(f,i){var b=document.createElement('button');b.className='tab'+(i==0?' on':'');b.textContent=f[0];
    b.onclick=function(){[].forEach.call(tabs.children,function(c,j){c.classList.toggle('on',j==i)});panel.textContent=f[1]};tabs.appendChild(b)});
  panel.textContent=F[0][1];
  // ボット（キーワード照合）
  var KB=[[['会費','いくら','費用','お金','料金'],'会費は5,000円です。'],[['場所','どこ','会場','店','行き方'],'場所は長野駅前の居酒屋「信州ばんや」です。'],[['何時','時間','開始','いつ','日'],'12月12日（金）18:30開始です。20:45に締めます。'],[['流れ','スケジュール','乾杯','ゲーム'],'18:30乾杯／19:00歓談／20:00ゲーム大会／20:45締め、の流れです。']];
  function norm(s){return s.normalize('NFKC').toLowerCase()}
  var log=document.getElementById('log'),qb=document.getElementById('qb');
  function add(t,c){var p=document.createElement('p');p.className=c||'';p.textContent=t;log.appendChild(p);log.scrollTop=log.scrollHeight}
  function ask(text){var t=norm(text);add(text,'me');
    var best=null,sc=0;KB.forEach(function(k){var n=0;k[0].forEach(function(w){if(t.indexOf(w)>=0)n++});if(n>sc){sc=n;best=k}});
    setTimeout(function(){add(best?best[1]:'すみません、分かりません。幹事に聞いてください。')},250)}
  ['会費は？','場所は？','何時から？','当日の流れは？'].forEach(function(q){var b=document.createElement('button');b.textContent=q;b.onclick=function(){ask(q)};qb.appendChild(b)});
  document.getElementById('bh').onclick=function(){document.getElementById('bot').classList.toggle('min')};
  // 参加ボタン＋紙吹雪
  var n=0,cnt=document.getElementById('cnt'),cv=document.getElementById('cv'),cx=cv.getContext('2d'),ps=[],run=false;
  function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
  function burst(){for(var i=0;i<90;i++)ps.push({x:innerWidth/2,y:innerHeight*0.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,c:['#c8412b','#d9a441','#2f6b4f','#1d2430'][i%4],s:5+Math.random()*6,l:90});
    if(!run){run=true;requestAnimationFrame(loop)}}
  function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);return p.l>0});
    if(ps.length)requestAnimationFrame(loop);else run=false}
  document.getElementById('join').onclick=function(){n++;cnt.textContent=n;burst()};
})();
</script>
